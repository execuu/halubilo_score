name: halubilo
services:
  web:
    build:
      context: .
      target: runtime
    image: halubilo-scoresheet:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/scoresheet.db
      UPLOAD_FOLDER: /data/uploads
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - event_data:/data
      - backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  event_data:
  backups:
