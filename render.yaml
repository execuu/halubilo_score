services:
  - type: web
    name: halubilo-scoresheet
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerCommand: python scripts/start_cloud.py
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: HTTPS_ONLY
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: team-images
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: EVENT_NAME
        value: Halubilo
