{% macro csrf() %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endmacro %}
{% macro reason() %}<label>Reason<input name="reason" required maxlength="1000" placeholder="Explain the change for the audit history"></label>{% endmacro %}
{% macro pages(pagination) %}{% if pagination.pages > 1 %}<div class="flex gap-4 my-4">{% if pagination.has_prev %}<a href="?page={{ pagination.prev_num }}">Previous</a>{% endif %}<span>Page {{ pagination.page }} of {{ pagination.pages }}</span>{% if pagination.has_next %}<a href="?page={{ pagination.next_num }}">Next</a>{% endif %}</div>{% endif %}{% endmacro %}
