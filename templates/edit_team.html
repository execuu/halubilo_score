{% extends 'base.html' %}{% from 'macros.html' import csrf, reason %}{% block content %}<h1>Edit team</h1><section class="card"><form method="post" enctype="multipart/form-data">{{ csrf() }}<label>Team name<input name="name" value="{{ team.name }}" required maxlength="100"></label><label>Replace image (optional)<input name="image" type="file" accept="image/jpeg,image/png,image/gif,image/webp"></label>{{ reason() }}<button class="mt-4">Save team</button></form></section><details class="card"><summary>Delete team</summary><p class="muted">Teams with scores cannot be deleted.</p><form method="post" action="{{ url_for('delete_team', team_id=team.id) }}" data-confirm="Delete this team?">{{ csrf() }}{{ reason() }}<button class="danger mt-4">Delete team</button></form></details>{% endblock %}
