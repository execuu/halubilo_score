{% extends 'base.html' %}{% from 'macros.html' import csrf, reason %}{% block content %}<h1>Edit activity</h1><section class="card"><form method="post">{{ csrf() }}<label>Activity name<input name="name" value="{{ activity.name }}" required maxlength="100"></label><label>Maximum score<input name="max_score" type="number" min="1" max="1000" step="1" value="{{ activity.max_score }}" required></label><label>Description<textarea name="description" maxlength="2000">{{ activity.description }}</textarea></label>{{ reason() }}<button class="mt-4">Save activity</button></form></section><details class="card"><summary>Delete activity</summary><p class="muted">Activities with scores or assigned users cannot be deleted.</p><form method="post" action="{{ url_for('delete_activity', activity_id=activity.id) }}" data-confirm="Delete this activity?">{{ csrf() }}{{ reason() }}<button class="danger mt-4">Delete activity</button></form></details>{% endblock %}
